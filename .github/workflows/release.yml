name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest

      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-

      - run: clojure -M:test

  build-uberjar:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest

      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-

      - name: Build uberjar
        run: clojure -J-Dcljs-patrol.version=${GITHUB_REF_NAME#v} -T:build uber

      - uses: actions/upload-artifact@v4
        with:
          name: uberjar
          path: target/cljs-patrol-*.jar

  build-native:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest
            target: macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest

      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-

      - name: Build native binary
        run: clojure -J-Dcljs-patrol.version=${GITHUB_REF_NAME#v} -T:build native

      - name: Rename binary with version and target
        run: mv target/cljs-patrol target/cljs-patrol-${GITHUB_REF_NAME#v}-${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: target/cljs-patrol-*-${{ matrix.target }}

  release:
    needs: [build-uberjar, build-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  update-changelog:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Update CHANGELOG.md on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git switch -c main origin/main
          DATE=$(date -u +%Y-%m-%d)
          NOTES=$(gh release view "$VERSION" --json body --jq .body \
                  | awk '/^## / { print; print ""; next } { print }' \
                  | cat -s)
          {
            echo "# Changelog"
            echo
            echo "## [$VERSION] - $DATE"
            echo
            echo "$NOTES"
            if [ -f CHANGELOG.md ]; then
              echo
              tail -n +2 CHANGELOG.md
            fi
          } > CHANGELOG.new.md
          mv CHANGELOG.new.md CHANGELOG.md
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changelog changes"
          else
            git commit -m "Update CHANGELOG for ${VERSION}"
            git push origin main
          fi
