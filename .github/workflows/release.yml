name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest

      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-

      - name: Run tests
        run: clojure -M:test

      - name: Build uberjar
        run: clojure -J-Dcljs-patrol.version=${GITHUB_REF_NAME#v} -T:build uber

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/cljs-patrol-*.jar
          generate_release_notes: true
