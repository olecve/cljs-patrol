name: Test

on:
  # A branch is checked through its pull request, so each commit runs once. With a push
  # trigger on every branch too, one of the two runs was cancelled, and GitHub shows a
  # cancelled run as a failed check on the PR.
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new commit on a PR supersedes the run on the previous one. A run on main is never
# cancelled, so every merge commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest

      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run format:check

      - run: clojure -M:cljfmt check src/ test/
      - run: clojure -M:clj-kondo --lint src test build.clj
      - run: clojure -M:test

      - name: Patrol our own sources
        # The experimental .clj mode reads this repo, so the rules the tool
        # enforces on a consumer hold for the tool itself. A group's failed? is
        # false for a cleanup rule, so --fail-on is what makes this a check
        # rather than a printout. The rules are named one by one instead of by
        # tier because two of them do not hold on .clj: js-hint-in-test is about
        # externs inference, and var-deref-in-test flags @#'private-fn, which
        # docs/rules.md itself calls established on the JVM. A new rule in any of
        # these groups has to be added here, or it will not gate.
        run: >-
          clojure -M:run --experimental-clj --only docstrings,tests,layout,idioms
          --fail-on docstring-summary,docstring-indentation,docstring-leading-trailing-whitespace,deftest-leading-article,assertion-message-inline,conditional-assertion,get-by-presence-check,form-after-split-map,split-map-after-sibling,nested-call-chain,cond-else-nil,negated-test,into-empty,plus-minus-one,negated-equality
          src test build.clj

  native-verify:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest

      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-

      - run: clojure -T:build native
      - run: ./target/cljs-patrol --help

      - name: Exercise the baseline writer on the native binary
        # --help never reaches write-baseline. Reflective interop only fails in
        # a native build, so the writer has to be run from the real binary.
        run: |
          cd test-projects/a11y-app
          "$GITHUB_WORKSPACE/target/cljs-patrol" --only a11y --baseline-write src
          grep -q ':issues' src/.cljs-patrol/baseline.edn
          "$GITHUB_WORKSPACE/target/cljs-patrol" --only a11y --baseline src

      - name: Refuse a baseline write that adds findings unless --allow-new
        run: |
          cd test-projects/a11y-app
          patrol="$GITHUB_WORKSPACE/target/cljs-patrol"
          "$patrol" --only a11y --baseline-write src
          "$patrol" --only a11y --baseline-write src
          cp src/.cljs-patrol/baseline.edn before.edn
          printf '(ns blogapp.added)\n(defn notes [] [:textarea])\n' > src/blogapp/added.cljs
          if "$patrol" --only a11y --baseline-write src > refused.txt; then exit 1; fi
          grep -q 'Refusing to write' refused.txt
          grep -q 'src/blogapp/added.cljs' refused.txt
          cmp before.edn src/.cljs-patrol/baseline.edn
          "$patrol" --only a11y --baseline-write --allow-new src
          grep -q 'blogapp/added.cljs' src/.cljs-patrol/baseline.edn
          rm src/blogapp/added.cljs
          "$patrol" --only a11y --baseline-write src
          if grep -q 'blogapp/added.cljs' src/.cljs-patrol/baseline.edn; then exit 1; fi
          if "$patrol" --allow-new src > stray.txt; then exit 1; fi
          grep -q 'only applies to --baseline-write' stray.txt
          echo '[1 2 3]' > src/.cljs-patrol/baseline.edn
          if "$patrol" --only a11y --baseline-write src > unreadable.txt; then exit 1; fi
          grep -q 'Re-run --baseline-write --allow-new' unreadable.txt
          "$patrol" --only a11y --baseline-write --allow-new src
