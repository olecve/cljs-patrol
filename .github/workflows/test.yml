name: Test

on:
  push:
    # Every branch, so work in progress is checked before a PR exists.
    # '**' matches branches only, leaving tag pushes to the release workflow.
    branches: ['**']
  pull_request:
    branches: [main]

# A PR branch is covered by both triggers. Grouping them under one branch-derived
# key with cancel-in-progress means the second run supersedes the first instead of
# building the native binary twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest

      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run format:check

      - run: clojure -M:cljfmt check src/ test/
      - run: clojure -M:clj-kondo --lint src test/cljs_patrol build.clj
      - run: clojure -M:test

      - name: Patrol our own sources
        # The experimental .clj mode reads this repo, so the rules the tool
        # enforces on a consumer hold for the tool itself. Only the two groups
        # that mean anything outside ClojureScript are enabled. Every rule in
        # both is :cleanup, and a group's failed? is false for a cleanup rule,
        # so --fail-on is what makes this a check rather than a printout.
        run: clojure -M:run --experimental-clj --only docstrings,tests --fail-on cleanup src test/cljs_patrol build.clj

  native-verify:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest

      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-

      - run: clojure -T:build native
      - run: ./target/cljs-patrol --help

      - name: Exercise the baseline writer on the native binary
        # --help never reaches write-baseline. Reflective interop only fails in
        # a native build, so the writer has to be run from the real binary.
        run: |
          cd test/projects/a11y-app
          "$GITHUB_WORKSPACE/target/cljs-patrol" --only a11y --baseline-write src
          grep -q ':issues' src/.cljs-patrol/baseline.edn
          "$GITHUB_WORKSPACE/target/cljs-patrol" --only a11y --baseline src
